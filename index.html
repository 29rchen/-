<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关系复原胶</title>

<style>
* {
box-sizing: border-box;
}

body {
margin: 0;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
background: #fff5f5;
font-family: Arial, "Microsoft YaHei", sans-serif;
color: #5b4545;
}

.card {
width: min(90%, 460px);
padding: 35px 25px;
text-align: center;
background: white;
border-radius: 24px;
box-shadow: 0 8px 30px rgba(150, 90, 90, 0.12);
transition: all 0.3s ease;
}

.sticker {
width: 120px;
max-width: 45%;
margin-bottom: 15px;
}

h1 {
font-size: 25px;
margin: 10px 0;
}

.subtitle {
font-size: 14px;
line-height: 1.7;
color: #987878;
margin-bottom: 25px;
}

.buttons {
display: flex;
flex-direction: column;
gap: 12px;
}

button {
border: none;
border-radius: 30px;
padding: 14px 20px;
font-size: 16px;
cursor: pointer;
transition: all 0.3s ease;
}

#useButton {
background: #e99b9b;
color: white;
flex: 1;
}

#laterButton {
background: #fff0f0;
color: #a87575;
flex: 1;
}

.card.waiting #laterButton {
flex: 0.65;
transform: scale(0.9);
}

.card.waiting #useButton {
flex: 1.35;
transform: scale(1.04);
}

#laterMessage {
display: none;
font-size: 17px;
line-height: 1.8;
color: #987878;
margin-top: 20px;
}

#videoPanel {
display: none;
margin-top: 20px;
}

#repairVideo {
width: 100%;
border-radius: 14px;
}

.card.goodbye .buttons {
display: none;
}

</style>
</head>

<body>

<main class="card" id="card">

<img
class="sticker"
src="bandage-sticker.png"
alt="创可贴"
>

<h1 id="heading">要使用关系复原胶吗？</h1>

<p class="subtitle" id="subheading">
把小小的误会贴起来，给关系一个重新开始的机会。
</p>

<div class="buttons" id="buttons">
<button id="useButton">使用关系复原胶</button>
<button id="laterButton">暂时不用</button>
</div>

<p id="laterMessage">
没关系，什么时候想好了都可以再来
</p>

<section id="videoPanel">
<video id="repairVideo" controls playsinline preload="metadata">
<source src="relationship-repair-video.mp4" type="video/mp4">
你的浏览器暂不支持播放视频。
</video>
</section>

</main>

<script>
const card = document.getElementById('card');
const heading = document.getElementById('heading');
const subheading = document.getElementById('subheading');
const buttons = document.getElementById('buttons');
const useButton = document.getElementById('useButton');
const laterButton = document.getElementById('laterButton');
const laterMessage = document.getElementById('laterMessage');
const videoPanel = document.getElementById('videoPanel');
const repairVideo = document.getElementById('repairVideo');

let hasDeclinedOnce = false;
let hasStarted = false;

laterButton.addEventListener('click', () => {
if (hasStarted) return;

if (!hasDeclinedOnce) {
hasDeclinedOnce = true;
card.classList.add('waiting');
return;
}

card.classList.remove('waiting');
card.classList.add('goodbye');
laterMessage.style.display = 'block';
});

useButton.addEventListener('click', async () => {
    laterMessage.style.display = 'none';
    document.getElementById('sticker').textContent = '💗';
    document.getElementById('heading').textContent = '关系复原中……';
    document.getElementById('subheading').textContent = '希望这一次，我们都能好好珍惜彼此。';
    document.getElementById('buttons').style.display = 'none';
    videoPanel.style.display = 'block';
    video.addEventListener('ended', () => {
      document.getElementById('heading').textContent = '关系复原成功！';
      document.getElementById('subheading').textContent = '愿我们都能带着理解和真诚，重新好好相处。';
      document.getElementById('sticker').textContent = '🩹💞';
    }, { once: true });
    try { await video.play(); } catch (e) {
      // If autoplay is blocked, the visible video controls let the user start it.
    }
  });

  laterButton.addEventListener('click', () => {
    laterMessage.style.display = 'block';
  });
</script>
</body>
</html>
