<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关系复原胶</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 28px 16px 42px;
    display: grid; place-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    color: #713b5a;
    background: radial-gradient(ellipse at 50% 15%, #fffaff 0%, #ffeaf3 48%, #ffd9e8 100%);
    overflow-x: hidden;
  }
  .card {
    position: relative; width: min(100%, 560px); padding: 28px 22px 24px;
    text-align: center; background: rgba(255,255,255,.76);
    border: 2px solid rgba(255,255,255,.95); border-radius: 34px;
    box-shadow: 0 18px 55px rgba(190, 91, 125, .16), inset 0 0 28px rgba(255,255,255,.7);
  }
  .mascot-wrap { height: 142px; display: grid; place-items: center; margin: -4px 0 4px; }
  .mascot { width: min(78%, 330px); max-height: 145px; object-fit: contain; filter: drop-shadow(0 9px 8px rgba(155,85,65,.14)); animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-7px) rotate(1deg); } }
  h1 { font-size: clamp(25px, 6vw, 34px); line-height: 1.25; margin: 8px 0 10px; color: #793d60; }
  .subtitle { color: #ad7895; line-height: 1.75; margin: 0 0 24px; font-size: 15px; }
  .buttons { display: flex; justify-content: center; align-items: center; gap: 13px; flex-wrap: wrap; min-height: 66px; }
  button { border: 0; border-radius: 999px; padding: 15px 22px; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform .42s cubic-bezier(.2,.8,.2,1), box-shadow .35s, opacity .35s; }
  #use { background: linear-gradient(135deg,#ff8db5,#ff5f98); color: white; box-shadow: 0 8px 20px #ff91b866, inset 0 2px 2px #ffffff99; flex: 1 1 220px; max-width: 270px; }
  #later { background: #f8eaf2; color: #91647f; box-shadow: inset 0 0 0 1px #f0d6e4; flex: 0 1 170px; }
  .card.waiting #use { transform: scale(1.17); box-shadow: 0 10px 25px #ff79aa88, inset 0 2px 2px #ffffffaa; }
  .card.waiting #later { transform: scale(.78); opacity: .78; }
  button:focus-visible { outline: 3px solid #c85c8b; outline-offset: 4px; }
  #laterMessage { display: none; margin: 24px auto 0; max-width: 420px; padding: 12px 16px; border-radius: 999px; color: #a75e81; background: #ffe0ed; font-weight: 650; font-size: 14px; animation: fadeIn .4s ease both; }
  #videoPanel { display: none; margin-top: 26px; padding: 20px 16px 16px; border-radius: 26px; background: rgba(255,255,255,.72); border: 1px solid white; box-shadow: 0 8px 25px rgba(220,120,160,.12); }
  #videoPanel .video-title { font-weight: 750; color: #874568; font-size: 22px; margin: 0 0 5px; }
  #videoPanel .video-sub { color: #b07896; font-size: 14px; margin: 0 0 16px; }
  video { display: block; width: 100%; border-radius: 18px; background: #15132a; }
  .tiny { font-size: 12px; margin: 24px 0 0; color: #c18ba5; letter-spacing: 1px; }
  .corner-mark { position: absolute; right: 15px; bottom: 9px; color: #e8a2bd; font-size: 13px; opacity: .78; letter-spacing: 1px; user-select: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 420px) { .card { padding: 22px 15px 22px; } .mascot-wrap { height: 120px; } .mascot { max-height: 122px; } button { padding: 13px 15px; } #later { flex-basis: 120px; } }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="mascot-wrap"><img class="mascot" src="bandage-sticker.png" alt="微笑的关系复原胶创可贴"></div>
  <h1 id="heading">要使用关系复原胶吗？</h1>
  <p class="subtitle" id="subheading">把小小的误会贴起来，给关系一个重新开始的机会。</p>
  <div class="buttons" id="buttons">
    <button id="use">使用关系复原胶 💗</button>
    <button id="later">暂时不用</button>
  </div>
  <div id="laterMessage">没关系，什么时候想好了都可以再来。🌷</div>
  <section id="videoPanel">
    <p class="video-title">关系复原中……</p>
    <p class="video-sub">希望这一次，我们都能好好珍惜彼此。</p>
    <video id="repairVideo" controls playsinline preload="metadata">
      <source src="relationship-repair-video.mp4" type="video/mp4">
      你的浏览器暂不支持播放视频。
    </video>
  </section>
  <p class="tiny">一支关系复原胶 · 一点点耐心 · 一次真诚的沟通</p>
  <span class="corner-mark" aria-hidden="true">？！</span>
</main>
<script>
  const card = document.getElementById('card');
  const useButton = document.getElementById('use');
  const laterButton = document.getElementById('later');
  const videoPanel = document.getElementById('videoPanel');
  const video = document.getElementById('repairVideo');
  const laterMessage = document.getElementById('laterMessage');
  const heading = document.getElementById('heading');
  const subheading = document.getElementById('subheading');
  let hasStarted = false;

  laterButton.addEventListener('click', () => {
    if (hasStarted) return;
    card.classList.add('waiting');
    laterMessage.style.display = 'block';
  });

  useButton.addEventListener('click', async () => {
    if (hasStarted) return;
    hasStarted = true;
    card.classList.remove('waiting');
    laterMessage.style.display = 'none';
    heading.textContent = '关系复原中……';
    subheading.textContent = '希望这一次，我们都能好好珍惜彼此。';
    document.getElementById('buttons').style.display = 'none';
    videoPanel.style.display = 'block';
    video.addEventListener('ended', () => {
      heading.textContent = '关系复原成功！';
      subheading.textContent = '愿我们都能带着理解和真诚，重新好好相处。';
    }, { once: true });
    try { await video.play(); } catch (e) { /* 用户可点击视频播放器开始播放 */ }
  });
</script>
</body>
</html>
