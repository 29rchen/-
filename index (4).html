<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffe8f1">
<title>关系复原胶</title>
<style>
  * { box-sizing: border-box; }
  :root { --plum:#793d60; --rose:#ff6f9f; --soft:#bd7e9c; }
  body {
    margin:0; min-height:100vh; padding:34px 16px 48px;
    display:flex; justify-content:center; align-items:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--plum); overflow-x:hidden;
    background: radial-gradient(ellipse at 50% 12%, #fffaff 0%, #ffeff6 43%, #ffd9e9 100%);
  }
  body::before, body::after { content:"♡"; position:fixed; z-index:-1; color:#ff9fc1; opacity:.25; font-size:130px; pointer-events:none; }
  body::before { top:4%; left:3%; transform:rotate(-18deg); }
  body::after { right:3%; bottom:4%; transform:rotate(18deg); }
  .card {
    width:min(100%,620px); position:relative; text-align:center;
    padding:26px 25px 48px; border-radius:38px;
    background:linear-gradient(145deg,rgba(255,255,255,.91),rgba(255,245,250,.83));
    border:2px solid rgba(255,255,255,.96);
    box-shadow:0 20px 60px rgba(190,91,125,.17), inset 0 0 35px rgba(255,255,255,.8);
  }
  .sparkles { position:absolute; inset:0; pointer-events:none; overflow:hidden; border-radius:36px; }
  .sparkles span { position:absolute; color:#ff9fbe; opacity:.65; animation:twinkle 2.8s ease-in-out infinite; }
  .sparkles span:nth-child(1){top:10%;left:7%;font-size:25px}
  .sparkles span:nth-child(2){top:17%;right:8%;font-size:20px;animation-delay:.8s}
  .sparkles span:nth-child(3){top:43%;left:4%;font-size:17px;animation-delay:1.3s}
  .sparkles span:nth-child(4){top:55%;right:5%;font-size:25px;animation-delay:.4s}
  @keyframes twinkle { 0%,100%{opacity:.35;transform:scale(.85) rotate(-8deg)} 50%{opacity:.95;transform:scale(1.12) rotate(8deg)} }
  .mascot-wrap { height:175px; display:grid; place-items:center; margin:-5px 0 2px; }
  .mascot { width:min(76%,340px); height:170px; object-fit:contain; filter:drop-shadow(0 9px 8px rgba(155,85,65,.15)); animation:float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-8px) rotate(1deg)} }
  h1 { font-size:clamp(27px,6vw,38px); line-height:1.28; margin:8px 0 12px; color:#813e62; letter-spacing:1px; }
  .subtitle { color:#b77b99; line-height:1.8; margin:0 0 25px; font-size:clamp(14px,3.5vw,17px); }
  .buttons { display:flex; justify-content:center; align-items:center; gap:14px; min-height:76px; flex-wrap:nowrap; }
  button { border:0; border-radius:999px; padding:16px 22px; font-size:clamp(14px,3.5vw,18px); font-weight:750; cursor:pointer; white-space:nowrap; transition:transform .48s cubic-bezier(.2,.8,.2,1),box-shadow .4s,opacity .4s; }
  #use { flex:1 1 58%; max-width:330px; color:white; background:linear-gradient(135deg,#ff91b8 0%,#ff6098 100%); box-shadow:0 9px 22px #ff8eb966,inset 0 2px 2px #ffffffb5; border:2px solid #ffd6e5; }
  #later { flex:0 1 34%; color:#91627d; background:linear-gradient(135deg,#fff4f9,#f5dfeb); box-shadow:inset 0 0 0 1.5px #f1d4e2,0 5px 13px #d99ab51c; }
  .card.waiting #use { transform:scale(1.16); box-shadow:0 12px 28px #ff79aa88,inset 0 2px 2px #ffffffc9; }
  .card.waiting #later { transform:scale(.76); opacity:.76; }
  button:focus-visible { outline:3px solid #c85c8b; outline-offset:4px; }
  #laterMessage { display:none; margin:25px auto 0; max-width:470px; padding:18px 16px; border-radius:999px; color:#a45e80; background:linear-gradient(100deg,#ffe0ed,#ffd5e7); box-shadow:inset 0 1px 3px #ffffffb5; font-weight:700; font-size:clamp(16px,4vw,21px); line-height:1.65; animation:fadeIn .5s ease both; }
  .card.goodbye .mascot-wrap,.card.goodbye #heading,.card.goodbye #subheading,.card.goodbye #buttons { display:none; }
  .card.goodbye #laterMessage { margin-top:38px; padding:30px 20px; }
  #videoPanel { display:none; margin-top:27px; padding:20px 17px 17px; border-radius:29px; background:rgba(255,255,255,.72); border:2px solid rgba(255,255,255,.94); box-shadow:0 9px 27px rgba(220,120,160,.13); }
  .video-heading { display:flex; justify-content:center; align-items:center; gap:13px; margin-bottom:15px; }
  .video-heading img { width:100px; height:83px; object-fit:contain; }
  .video-title { font-size:clamp(20px,4.5vw,26px); font-weight:800; color:#874568; margin:0 0 4px; }
  .video-sub { color:#b07896; font-size:14px; margin:0; line-height:1.6; }
  video { display:block; width:100%; border-radius:19px; background:#171522; box-shadow:0 5px 16px #d98eae55; }
  .success { display:none; margin:0 auto; padding:12px 8px 8px; animation:fadeIn .7s ease both; }
  .success img { display:block; width:min(70%,260px); max-height:245px; object-fit:contain; margin:0 auto 12px; filter:drop-shadow(0 8px 12px rgba(190,91,125,.15)); }
  .success h2 { margin:0; color:#843f63; font-size:clamp(25px,6vw,35px); }
  .success p { color:#b07896; margin:10px 0 0; line-height:1.8; font-size:clamp(14px,3.7vw,17px); }
  .tiny { font-size:12px; margin:26px 0 0; color:#c18ba5; letter-spacing:1px; }
  .date-mark,.corner-mark { position:absolute; bottom:10px; color:#e49bb8; user-select:none; }
  .date-mark { left:15px; font-size:11px; opacity:.78; letter-spacing:.5px; }
  .corner-mark { right:15px; font-size:14px; opacity:.82; letter-spacing:1px; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  @media(max-width:430px){
    body{padding:18px 10px 30px}.card{padding:20px 13px 45px;border-radius:30px}.mascot-wrap{height:145px}.mascot{height:143px}
    .buttons{gap:9px}button{padding:14px 10px}#use{flex-basis:60%}#later{flex-basis:33%}
    .video-heading img{width:78px;height:70px}.tiny{font-size:10px;letter-spacing:.3px}
  }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="sparkles" aria-hidden="true"><span>♡</span><span>♡</span><span>✧</span><span>♡</span></div>
  <div class="mascot-wrap"><img class="mascot" src="bandage-sticker.png" alt="微笑的创可贴"></div>
  <h1 id="heading">要使用关系复原胶吗？</h1>
  <p class="subtitle" id="subheading">把小小的误会贴起来，给关系一个重新开始的机会。</p>
  <div class="buttons" id="buttons">
    <button id="use">使用关系复原胶 ♡</button>
    <button id="later">暂时不用</button>
  </div>
  <div id="laterMessage">没关系，什么时候想好了都可以再来。🌷</div>
  <section id="videoPanel">
    <div class="video-heading" id="videoHeading">
      <img src="bandage-sticker.png" alt="创可贴">
      <div><p class="video-title">关系复原中……</p><p class="video-sub">希望这一次，我们都能好好珍惜彼此。</p></div>
    </div>
    <video id="repairVideo" controls playsinline preload="metadata">
      <source src="relationship-repair-video.mp4" type="video/mp4">
      你的浏览器暂不支持播放视频。
    </video>
    <div class="success" id="success" aria-live="polite">
      <img src="dog-sticker.png" alt="小狗贴纸">
      <h2>关系复原成功！♡</h2>
      <p>愿我们都能带着理解和真诚，重新好好相处。</p>
    </div>
  </section>
  <p class="tiny">— 一支关系复原胶 · 一点点耐心 · 一次真诚的沟通 —</p>
  <span class="date-mark" aria-hidden="true">2025.02.11</span>
  <span class="corner-mark" aria-hidden="true">？！</span>
</main>
<script>
  const card=document.getElementById('card');
  const useButton=document.getElementById('use');
  const laterButton=document.getElementById('later');
  const video=document.getElementById('repairVideo');
  const videoPanel=document.getElementById('videoPanel');
  const laterMessage=document.getElementById('laterMessage');
  let hasDeclinedOnce=false,hasStarted=false;

  laterButton.addEventListener('click',()=>{
    if(hasStarted)return;
    if(!hasDeclinedOnce){
      hasDeclinedOnce=true;
      card.classList.add('waiting');
      return;
    }
    card.classList.remove('waiting');
    card.classList.add('goodbye');
    laterMessage.style.display='block';
  });

  useButton.addEventListener('click',async()=>{
    if(hasStarted)return;
    hasStarted=true;
    card.classList.remove('waiting','goodbye');
    laterMessage.style.display='none';
    document.getElementById('heading').textContent='关系复原中……';
    document.getElementById('subheading').textContent='希望这一次，我们都能好好珍惜彼此。';
    document.getElementById('buttons').style.display='none';
    videoPanel.style.display='block';
    video.addEventListener('ended',()=>{
      document.getElementById('videoHeading').style.display='none';
      video.style.display='none';
      document.getElementById('success').style.display='block';
      document.getElementById('heading').style.display='none';
      document.getElementById('subheading').style.display='none';
      document.querySelector('.mascot-wrap').style.display='none';
      document.querySelector('.tiny').style.display='none';
    },{once:true});
    try{await video.play();}catch(error){/* 自动播放受限时可点击播放器 */}
  });
</script>
</body>
</html>
